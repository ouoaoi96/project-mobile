<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>제품소개-제품 검색</title>
    <link rel="apple-touch-icon-precomposed" href="./app_icon.png">

    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=block">
    <link rel="stylesheet" href="./css/swiper.min.css">
    <link rel="stylesheet" href="./css/aos.css">
    <link rel="stylesheet" href="./css/common.css">
    <link rel="stylesheet" href="./css/sub3_3.css">

    <script src="https://kit.fontawesome.com/486f5e5f33.js" crossorigin="anonymous"></script>
    <script>
        // <![CDATA[
        try {
            window.addEventListener('load', function () {
                setTimeout(scrollTo, 0, 0, 1);
            }, false);
        }
        catch (e) { }
        // ]]>
    </script>
</head>

<body>
    <div id="skipNav">
        <a href="#content">본문바로가기</a>
        <a href="#gnb">네비게이션바로가기</a>
    </div>


    <div id="wrap">
        <header id="headerArea">
            <!-- 헤더 공통영역 로드 처리 -->
            <!-- <h1><a href="index.html">로고</a></h1>
           
           <nav id="gnb">
              <h2 class="hidden">글로벌네비게이션영역</h2>
               
           </nav> -->

        </header>
        <div class="visual sub_visual">
            <img src="./images/sub3_3/visualx2.jpg" alt="나무 선반 위에 전통주 병과 술잔">
            <div class="visual_txt">
                <span class="eng">PRODUCTS</span>
                <strong>제품소개</strong>
            </div>
        </div>

        <div class="sub_menu">
            <ul>
                <li><a href="./sub3_1.html">백세주</a></li>
                <li><a href="./sub3_2.html">법고창신</a></li>
                <li><a href="./sub3_3.html" class="active">제품 검색</a></li>
            </ul>
        </div>

        <main id="content">
            <article>
                <div class="title_area">
                    <p class="eng">PRODUCT</p>
                    <h2>한 잔의 시작을<br><strong>고르는 자리</strong></h2>
                    <p>국순당이 빚는 열일곱 가지 술을<br>만나보실 수 있습니다.</p>
                </div>
                <div class="content_area">
                    <div class="finder" data-aos="fade-up" data-aos-duration="1500">
                        <label for="title" class="hidden">제품명</label>
                        <input type="text" id="title" placeholder="제품명을 입력해 주세요">
                        <button type="button" id="btn">
                            <span class="material-symbols-outlined">search</span>
                            <span class="hidden">검색</span>
                        </button>
                    </div>
                    <div class="cate" data-aos="fade-up" data-aos-duration="1500" data-aos-delay="200">
                        <ul>
                            <li><button class="on all">전체</button></li>
                            <li><button class="bsj">백세주</button></li>
                            <li><button class="mgl">막걸리</button></li>
                            <li><button class="bg">법고창신</button></li>
                            <li><button class="yd">예담</button></li>
                        </ul>
                    </div>
                    <p class="count"></p>
                    <div class="product_list"></div>
                    <div class="modal_box">
                        <div class="popup">
                            <div class="pop_con"></div>
                            <a href="#" class="close_pop">닫기</a>
                        </div>
                    </div>
                </div>
            </article>
        </main>
        <footer id="footerArea">
            <!-- 푸터 공통영역 로드 처리 -->
        </footer>

    </div>

    <script src="./js/jquery-1.12.4.min.js"></script>
    <script src="./js/jquery-migrate-1.4.1.min.js"></script>
    <script src="./js/swiper.min.js"></script>
    <script>
        $('#headerArea').load('./common/main_header.html', function () {
            //function(){} -> main_header.html의 로드가 완료가 되면...
            $.getScript('./js/common.js');  //스크립트 js파을을 동작시키는 메소드
        });

        $('#footerArea').load('./common/main_footer.html', function () {
            $.getScript('./js/select.js');  //푸터 로드가 끝나면 패밀리사이트 js 실행
        });
    </script>
    <script src="./js/aos.js"></script>
    <script src="./js/sub3_3.js"></script>
</body>

</html>
